{% extends "general/base.html" %}

{% block page_title %}Sign In{% endblock page_title %}

{% block body %}
<h2>Sign In</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="{% url 'client:signup' %}">Sign Up</a></p>
{% endblock body %}
