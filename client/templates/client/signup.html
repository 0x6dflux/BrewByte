{% extends "general/base.html" %}

{% block page_title %}Sign Up{% endblock page_title %}

{% block body %}
<h2>Sign Up</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="{% url 'client:signin' %}">Sign In</a></p>
{% endblock body %}
