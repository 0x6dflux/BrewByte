{% extends "general/base.html" %}

{% block page_title %}Add Address{% endblock %}

{% block body %}
<div class="container mt-5" style="direction: ltr; text-align: left;">
    <h2 class="mb-4">Add New Address</h2>
    
    <form method="POST" action="{% url 'client:address_add' %}" id="address-form"> 
        {% csrf_token %}
        
        <div style="background-color: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
            
            <div class="mb-3">
                <label for="id_name" style="font-weight: bold; color: #555;">Address Title:</label><br>
                <input type="text" id="id_name" name="name" value="{{ form.name.value|default_if_none:'' }}" 
                       style="padding: 8px; border-radius: 5px; border: 1px solid #ccc; width: 100%; max-width: 400px; margin-top: 5px;" required>
            </div>

            <div class="mb-3">
                <label for="id_postal_address" style="font-weight: bold; color: #555;">Postal Address:</label><br>
                <textarea id="id_postal_address" name="postal_address" rows="3" 
                          style="padding: 8px; border-radius: 5px; border: 1px solid #ccc; width: 100%; max-width: 400px; margin-top: 5px;" required>{{ form.postal_address.value|default_if_none:'' }}</textarea>
            </div>

            <button type="submit" class="btn btn-success" style="margin-top: 10px;">Save Address</button>
            <a href="{% url 'client:profile_edit' %}" class="btn btn-secondary" style="margin-top: 10px; margin-left: 10px;">Cancel</a>
        </div>
    </form>

    {% if messages %}
        {% for message in messages %}
            <div style="padding: 10px; background: #e0f7fa; margin: 10px 0;">{{ message }}</div>
        {% endfor %}
    {% endif %}
</div>
{% endblock %}
